<!-- prettier-ignore -->
{% set google_ott_link = website.website_routes.oauth2.google_ott %}
{% set google_client_id = website.website_basic_info.google.google_client_id %}

<script>
  // Google login logic
  window.onload = function () {
    google.accounts.id.initialize({
      client_id: "{{ google_client_id | safe }}",
      callback: handleCredentialResponse,
      auto_select: false,
    });
    google.accounts.id.prompt();
  };

  async function handleCredentialResponse(response) {
    try {
      const res = await fetch("{{ google_ott_link | safe }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: response.credential }),
        credentials: "include",
      });

      if (res.ok) {
        const html = await res.text();
        window.htmx.swap("#validate-login-btn", html, { swapStyle: "outerHTML" });

        if (window.Alpine) {
          Alpine.store("toast").success("You have been logged in!");
        }
      } else {
        if (window.Alpine) {
          Alpine.store("toast").error("Login failed. Please try again.");
        }
      }
    } catch (error) {
      console.error("Unexpected error during Google login:", error);
      if (window.Alpine) {
        Alpine.store("toast").error("Something went wrong. Please refresh and try again.");
      }
    }
  }
</script>
