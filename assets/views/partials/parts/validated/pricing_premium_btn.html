<!-- prettier-ignore -->
<div
id="pricing-premium-btn"
class="w-full flex flex-col gap-4 items-start justify-start"
{% if is_ott %} hx-swap-oob="true" {% endif %}
>
{% if user %}
  <a
    :href="'{{checkout_prepare_link | safe}}/{{ user.pid }}/' + (isPlus ? 'premiumplus' : 'premium')"
    class="w-full"
  >
    <div
      class="w-full bg-grn-to rounded-xl px-8 py-4 flex items-center justify-center gap-3 shadow-sm hover:shadow-md transition-shadow"
    >
      <span class="text-white text-center font-inter text-base font-medium leading-none">
        {{ t(key="pricing-cta-premium", lang=lang) }}<span x-show="isPlus">+</span>
      </span>
    </div>
  </a>
{% else %}
  {% include "home/sections/partials/pricing_auth_modal.html" %}
{% endif %}
</div>
