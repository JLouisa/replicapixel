<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS, Tailwind & DaisyUI Demo</title>

    <!-- 1. Tailwind & DaisyUI CDN -->
    <!-- We use the "full.css" file which includes Tailwind CSS classes and all DaisyUI components -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Optional: Add a nice font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-base-200 min-h-screen transition-colors duration-300">
    <!-- Navbar -->
    <div class="navbar bg-base-100 shadow-lg">
      <div class="flex-1">
        <a class="btn btn-ghost text-xl">ProfileApp</a>
      </div>
      <div class="flex-none">
        <!-- Theme Toggle -->
        <label class="flex cursor-pointer gap-2 items-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
            />
          </svg>
          <input type="checkbox" value="dark" class="toggle toggle-primary" id="theme-toggle" />
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </label>
      </div>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto p-4 md:p-8 flex justify-center">
      <!-- Profile Card -->
      <div class="card w-full max-w-lg bg-base-100 shadow-xl">
        <div class="card-body">
          <h2 class="card-title text-2xl mb-4">Edit Your Profile</h2>

          <!-- Form -->
          <form id="profile-form">
            <!-- Name Input -->
            <div class="form-control w-full mb-4">
              <label class="label">
                <span class="label-text">What is your name?</span>
              </label>
              <input
                id="name-input"
                type="text"
                placeholder="e.g., Jane Doe"
                class="input input-bordered w-full"
                required
              />
            </div>

            <!-- Email Input -->
            <div class="form-control w-full mb-6">
              <label class="label">
                <span class="label-text">What is your email?</span>
              </label>
              <input
                id="email-input"
                type="email"
                placeholder="e.g., jane.doe@example.com"
                class="input input-bordered w-full"
                required
              />
            </div>

            <div class="card-actions justify-end">
              <button type="submit" class="btn btn-primary">Update Profile</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- Confirmation Modal -->
    <dialog id="confirmation_modal" class="modal">
      <div class="modal-box">
        <h3 class="font-bold text-lg text-success">Profile Updated!</h3>
        <p class="py-4">Your new details have been saved:</p>
        <div>
          <p><strong>Name:</strong> <span id="modal-name"></span></p>
          <p><strong>Email:</strong> <span id="modal-email"></span></p>
        </div>
        <div class="modal-action">
          <form method="dialog">
            <!-- if there is a button in form, it will close the modal -->
            <button class="btn">Close</button>
          </form>
        </div>
      </div>
    </dialog>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast toast-top toast-center"></div>

    <!-- 2. JavaScript -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // --- Get DOM Elements ---
        const themeToggle = document.getElementById("theme-toggle");
        const profileForm = document.getElementById("profile-form");
        const nameInput = document.getElementById("name-input");
        const emailInput = document.getElementById("email-input");
        const confirmationModal = document.getElementById("confirmation_modal");
        const modalName = document.getElementById("modal-name");
        const modalEmail = document.getElementById("modal-email");
        const toastContainer = document.getElementById("toast-container");

        // --- Theme Switcher Logic ---
        const currentTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", currentTheme);
        themeToggle.checked = currentTheme === "dark";

        themeToggle.addEventListener("change", (e) => {
          const newTheme = e.target.checked ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", newTheme);
          localStorage.setItem("theme", newTheme);
        });

        // --- Form Submission Logic ---
        profileForm.addEventListener("submit", (e) => {
          e.preventDefault(); // Prevent the default form submission

          // Get values from the form
          const name = nameInput.value;
          const email = emailInput.value;

          // Update the modal content with the new data
          modalName.textContent = name;
          modalEmail.textContent = email;

          // Show the modal
          confirmationModal.showModal();

          // Show a success toast
          showToast("Profile updated successfully!", "success");

          // Optional: Clear the form after submission
          profileForm.reset();
        });

        // --- Toast Notification Function ---
        function showToast(message, type = "info") {
          const toast = document.createElement("div");
          toast.className = `alert alert-${type} shadow-lg`;
          toast.innerHTML = `<span>${message}</span>`;

          toastContainer.appendChild(toast);

          // Automatically remove the toast after 3 seconds
          setTimeout(() => {
            toast.style.opacity = "0";
            toast.style.transform = "translateY(-20px)";
            setTimeout(() => toast.remove(), 300); // Wait for transition
          }, 3000);
        }
      });
    </script>
  </body>
</html>
