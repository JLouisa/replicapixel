<dialog id="video-modal" class="modal">
  <div class="modal-box w-full max-w-7xl bg-white rounded-2xl shadow-md overflow-hidden">
    <div class="relative aspect-video">
      <video id="video-player" class="w-full aspect-video" controls preload="none" playsinline>
        <source src="" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="p-4 space-y-2">
      <h3 id="video-title" class="text-lg font-semibold text-gray-800">Video Title</h3>
      <p class="text-sm text-gray-500">
        Prompt: <span id="video-prompt" class="text-gray-700">"Your prompt here..."</span>
      </p>
      <div class="flex justify-between text-sm text-gray-500">
        <span>Duration: <span id="video-duration">00:30</span>s</span>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button
          class="px-3 py-1 rounded-md text-sm text-white bg-green-600 hover:bg-green-700 cursor-pointer"
        >
          Download
        </button>
        <button
          class="px-3 py-1 rounded-md text-sm text-white bg-blue-600 hover:bg-blue-700 cursor-pointer"
        >
          Favorite
        </button>
        <button
          class="px-3 py-1 rounded-md text-sm text-white bg-red-600 hover:bg-red-700 cursor-pointer"
        >
          Delete
        </button>
      </div>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
