{% set feature_link = options.website.website_routes.feature_routes.add %} {% set user =
options.user %}
<form
  id="feature-form"
  hx-post="{{ feature_link | safe }}"
  hx-ext="form-json"
  hx-disabled-elt="#feature-btn"
  hx-swap="outerHTML"
>
  <div class="form-control w-full">
    <input
      id="feature-id"
      name="user_id"
      type="number"
      value="{{user.id}}"
      hidden
      class="input input-bordered w-full"
    />
    <label class="label" for="feature-title">
      <span class="label-text">{{ t(key="feature-form-label-title", lang=lang) }}</span>
    </label>
    <input
      id="feature-title"
      name="title"
      type="text"
      placeholder="{{ t(key='feature-form-placeholder-title', lang=lang) }}"
      class="input input-bordered w-full"
    />
  </div>

  <div class="form-control w-full mt-4">
    <label class="label" for="feature-description">
      <span class="label-text">{{ t(key="feature-form-label-description", lang=lang) }}</span>
    </label>
    <textarea
      id="feature-description"
      name="description"
      class="textarea textarea-bordered h-24 w-full"
      placeholder="{{ t(key='feature-form-placeholder-description', lang=lang) }}"
    ></textarea>
  </div>

  <div class="card-actions justify-end mt-6">
    <button id="feature-btn" type="submit" class="btn btn-primary w-full">
      {{ t(key="feature-form-button-submit", lang=lang) }}
    </button>
  </div>
</form>
