{% set lang = options.language %} {% set website_restore_link =
options.website.website_routes.image.image_restore %} {% set website_base_link =
options.website.website_routes.image.base %} {% if options.is_deleted %} {% set lang =
options.language %}
<button
  hx-delete="{{ website_restore_link | safe }}/{{ image.pid }}"
  hx-target="#img-container-{{ image.pid }}"
  hx-confirm="{{ t(key='image-action-confirm-restore', lang=lang) }}"
  hx-swap="outerHTML"
  class="btn btn-info btn-xs md:btn-md"
>
  <span class="hidden sm:inline">{{ t(key="image-action-restore", lang=lang) }}</span> {% include
  "partials/svg/restore.html" %}
</button>
{% else %}
<button
  hx-delete="{{ website_base_link | safe }}/{{ image.pid }}"
  hx-target="#img-container-{{ image.pid }}"
  hx-confirm="{{ t(key='image-action-confirm-delete', lang=lang) }}"
  hx-swap="outerHTML"
  class="btn btn-error btn-xs md:btn-md"
>
  <span class="hidden sm:inline">{{ t(key="image-action-delete", lang=lang) }}</span> {% include
  "partials/svg/trash.html" %}
</button>
{% endif %}
