<div
  id="failed-{{ image.pid }}"
  class="relative select-none flex flex-col items-center justify-center gap-2 p-2 text-center aspect-square rounded-lg shadow-md overflow-hidden bg-red-100 text-red-700"
>
  {% include "partials/svg/error_icon.html" %} {# Assumes you have an error icon SVG #}
  <p class="text-xs font-semibold">Generation Failed</p>
  <button
    hx-delete="{{ options.website.website_routes.image.api_image_delete | safe }}/{{ image.pid }}"
    hx-target="#failed-{{ image.pid }}"
    hx-swap="delete"
    class="btn btn-error btn-xs"
  >
    Remove
  </button>
</div>
