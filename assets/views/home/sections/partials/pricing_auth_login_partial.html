<div id="login-modal-{{pricing.plan_name}}-box" class="modal-box max-w-md">
  <!-- Close Button -->
  <form method="dialog">
    <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
  </form>

  <!-- Modal Header -->
  <div class="text-center">
    <h3 class="text-2xl font-bold">Login</h3>
    <p class="py-2">Login into your Account</p>
    <!-- Replaced info box with a theme-sensitive "alert" -->
    <div role="alert" class="alert alert-success mt-4">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        class="stroke-current shrink-0 w-6 h-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        ></path>
      </svg>
      <span class="text-sm font-medium"
        >Selected: {{pricing.plan_name | capitalize}} Plan (${{pricing.price}})</span
      >
    </div>
  </div>

  <!-- Form -->
  <form
    id="signup-form-{{pricing.plan_name}}"
    class="space-y-4 mt-6"
    hx-post="{{ login_api_link  | safe }}"
    hx-ext="form-json"
    hx-target="#app"
    hx-swap="innerHTML"
    hx-disabled-elt="#create-account-btn-{{pricing.plan_name}}"
  >
    <!-- Email -->
    <label class="input input-bordered flex items-center gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 16 16"
        fill="currentColor"
        class="w-4 h-4 opacity-70"
      >
        <path
          d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793c.026.009.051.02.076.032L7.674 8.51c.206.1.446.1.652 0l6.598-3.185A.755.755 0 0 1 15 5.293V4.5A1.5 1.5 0 0 0 13.5 3h-11Z"
        />
        <path
          d="M15 6.954 8.978 9.86a2.25 2.25 0 0 1-1.956 0L1 6.954V11.5A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5V6.954Z"
        />
      </svg>
      <input type="email" class="grow" placeholder="Email" required />
    </label>

    <!-- Password -->
    <label class="input input-bordered flex items-center gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 16 16"
        fill="currentColor"
        class="w-4 h-4 opacity-70"
      >
        <path
          fill-rule="evenodd"
          d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2.293a.5.5 0 0 1 .146-.353l3.955-3.955A4 4 0 1 1 14 6Zm-4-2a.75.75 0 0 0 0 1.5.5.5 0 0 1 .5.5.75.75 0 0 0 1.5 0 2 2 0 0 0-2-2Z"
          clip-rule="evenodd"
        />
      </svg>
      <input type="password" class="grow" placeholder="Password" required />
    </label>

    <input type="text" class="hidden" value="{{pricing.pid}}" required />
  </form>

  <!-- Submit -->
  <button
    id="create-account-btn-{{pricing.plan_name}}"
    type="submit"
    form="signup-form-{{pricing.plan_name}}"
    class="btn btn-primary w-full mt-6"
  >
    Login
  </button>

  <!-- Divider -->
  <div class="divider">OR</div>

  <!-- Footer -->
  <div class="text-center text-sm">
    <p>Don't have an account?</p>
    <!-- Replaced button with "btn-link" for semantic styling -->
    <button class="btn btn-link btn-primary">Sign Up</button>
  </div>
</div>
