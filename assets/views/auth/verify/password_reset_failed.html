<div
  hx-get="/login"
  hx-swap="innerHTML"
  hx-push-url="/login"
  hx-trigger="load delay:2s"
  class="flex flex-col items-center justify-center"
>
  <p class="text-xl text-center text-gray-800">Password Reset Failed!</p>
  <br />
  <p class="text-m text-gray-800">{{ error.general | default (value="") }}</p>
  <a href="/login" class="text-sm text-primary text-center mt-4">Back to Login</a>
</div>
